server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React SPA routes — /search, /app/*, /admin/*
  # Отдаём app.html (точка входа React-приложения)
  location ~* ^/(search|app|admin)(\/.*)?$ {
    try_files $uri /app.html;
  }

  # Статичные файлы (css, js, assets)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Главная страница и всё остальное — статичный index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
